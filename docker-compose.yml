services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: flavor_backend_cluster
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./public:/app/public:ro
      - ./server/app.js:/app/server/app.js:ro

  nginx:
    image: nginx:alpine
    container_name: flavor_nginx_proxy
    network_mode: "host"
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
